<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <title>Record — shoulder-mounted home video camera</title>
  <desc>A simple black 1980s VHS camcorder with a carry handle, eyepiece, cassette window, lens, and shoulder rest.</desc>
  <g fill="black">
    <!-- Carry handle; the opening and all separations remain transparent. -->
    <path fill-rule="evenodd" d="M250 318v-7l62-76q18-22 48-22h304q30 0 30 30v75Zm105-37q-8 11 6 11h282q16 0 16-16v-11q0-17-17-17H384q-14 0-22 11Z"/>
    <!-- Rear eyecup and the top of the cassette body. -->
    <path d="M89 310q0-28 20-10l20 18h39q15 0 20 10-21 11-21 39v50h-38l-20 19q-20 17-20-11Z"/>
    <path d="M180 419v-53q0-33 33-33h482q27 0 27 27v59Z"/>
    <!-- Cassette body and two broad tape-window cutouts. -->
    <path fill-rule="evenodd" d="M180 435h542v253q0 34-32 34H547q-20 0-38-14l-54-39q-14-10-34-10H214q-34 0-34-34Zm109 42q-25 0-25 25v77q0 25 25 25h274q25 0 25-25v-77q0-25-25-25Z"/>
    <path fill-rule="evenodd" d="M332 504h183a38 38 0 0 1 0 76H332a38 38 0 0 1 0-76Zm0 14a24 24 0 1 0 0 48 24 24 0 0 0 0-48Zm183 0a24 24 0 1 0 0 48 24 24 0 0 0 0-48Z"/>
    <!-- Lens barrel and wide front hood. -->
    <path d="M736 405h36l48-13v185l-48-13h-36Z"/>
    <path d="M836 386h70q10 0 10 99t-10 99h-70Z"/>
    <!-- Shoulder rest follows the underside of the body. -->
    <path d="M230 675h190q18 0 33 11l51 39q21 14 43 14h151v20q0 28-30 28H526q-19 0-39-7l-34-11q-12-4-31-4H259q-43 0-43-39v-37q0-14 14-14Z"/>
  </g>
</svg>
