# GitHub introduced this hosted public-preview label after actionlint's
# built-in runner catalog was published. Keep the exception scoped to the three
# approved workflows and remove it once actionlint recognizes the label.
paths:
  .github/workflows/ci.yml:
    ignore:
      - 'label "xcode-27" is unknown'
  .github/workflows/security.yml:
    ignore:
      - 'label "xcode-27" is unknown'
  .github/workflows/release.yml:
    ignore:
      - 'label "xcode-27" is unknown'
