name: Feature request
description: Propose a local-first Record capability.
title: "feature: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recording workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: data-boundary
    attributes:
      label: Can this remain fully local?
      options:
        - Yes
        - Unsure
        - No
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Security or performance tradeoffs
