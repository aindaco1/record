name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: CodeQL change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify complete change range
        id: scope
        run: python3 scripts/ci/change-scope.py --github-event --github-output

  analyze-swift:
    name: Analyze Swift
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # A skipped documentation push must not cancel an active source scan.
    concurrency:
      group: codeql-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select stable Xcode
        run: ./scripts/ci/select-stable-xcode.sh

      - name: Resolve locked dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      # github/codeql-action v4.37.7, pinned to a verified commit.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: >-
          swift build -c release --arch arm64
          --disable-automatic-resolution

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:swift
