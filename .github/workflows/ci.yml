name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version
      - name: Lint in pinned containers
        run: ./scripts/ci/container-lint.sh

  swift:
    name: Swift tests and arm64 build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1, pinned to prevent tag retargeting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      # This script is also the supported local validation entry point.
      - name: Validate
        run: ./scripts/ci/validate.sh

      - name: Build and verify distributable structure
        env:
          RECORD_VERSION: 0.0.0-ci
          RECORD_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/ci/package-gate.sh

  sanitizers:
    name: Swift sanitizer tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run ThreadSanitizer and AddressSanitizer
        run: ./scripts/ci/sanitizers.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/dependency-review-action v5.0.0, pinned to a verified commit.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT
