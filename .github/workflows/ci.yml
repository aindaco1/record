name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version
      - name: Lint in pinned containers
        run: ./scripts/ci/container-lint.sh

  swift:
    name: Swift tests and arm64 build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/checkout v7.0.1, pinned to prevent tag retargeting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select stable Xcode
        run: ./scripts/ci/select-stable-xcode.sh

      # This script is also the supported local validation entry point.
      - name: Validate
        run: ./scripts/ci/validate.sh

      - name: Build and verify distributable structure
        env:
          RECORD_VERSION: 0.0.0-ci
          RECORD_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/ci/package-gate.sh

      - name: Package exact-commit app for trusted release reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RECORD_CI_APP_ARTIFACT: ${{ runner.temp }}/record-ci-app-${{ github.sha }}.tar.gz
        run: |
          ./scripts/tools/package-ci-app.sh \
            "$GITHUB_WORKSPACE/.build/release-artifacts/Record.app" \
            "$RECORD_CI_APP_ARTIFACT" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Attest exact-commit app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/record-ci-app-${{ github.sha }}.tar.gz

      - name: Retain exact-commit app for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: record-verified-app-${{ github.sha }}
          path: ${{ runner.temp }}/record-ci-app-${{ github.sha }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  xcode-27-compatibility:
    name: Xcode 27 compatibility (preview)
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    steps:
      # Public-preview runner: compile/test signal only. Stable Xcode remains
      # authoritative for release packaging until Xcode 27 reaches GA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report preview toolchain
        run: |
          swift --version
          xcodebuild -version

      # Swift Build is Xcode 27's new default SwiftPM engine. Compile the app
      # with it even while its binary-framework test staging bug remains open.
      - name: Compile with the Swift Build engine
        run: swift build --build-system swiftbuild

      - name: Validate Swift 6.4 and the macOS 27 SDK
        env:
          # Xcode 27 beta 4's Swift Build engine does not stage Sparkle beside
          # executable-target test bundles. The native engine runs the complete
          # suite; the preceding step still guards Swift Build compilation.
          # https://github.com/swiftlang/swift-package-manager/issues/10384
          RECORD_SWIFT_BUILD_SYSTEM: native
        run: ./scripts/ci/validate.sh

  sanitizers:
    name: Swift sanitizer tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select stable Xcode
        run: ./scripts/ci/select-stable-xcode.sh
      - name: Run ThreadSanitizer and AddressSanitizer
        run: ./scripts/ci/sanitizers.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/dependency-review-action v5.0.0, pinned to a verified commit.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT
