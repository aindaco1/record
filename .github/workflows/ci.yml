name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ensure Podman is available
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes podman
          fi
          podman --version
      - name: Lint in pinned containers
        run: ./scripts/ci/container-lint.sh

  swift:
    name: Swift tests and arm64 build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2, pinned to prevent tag retargeting.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      # This script is also the supported local validation entry point.
      - name: Validate
        run: ./scripts/ci/validate.sh

      - name: Build and verify distributable structure
        env:
          RECORD_VERSION: 0.0.0-ci
          RECORD_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/ci/package-gate.sh

  sanitizers:
    name: Swift sanitizer tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run ThreadSanitizer and AddressSanitizer
        run: ./scripts/ci/sanitizers.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/dependency-review-action v4, pinned to a reviewed commit.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT
