name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Select stable Xcode
        run: ./scripts/ci/select-stable-xcode.sh

      - name: Define ephemeral signing paths
        run: |
          {
            printf 'SIGNING_CERTIFICATE_PATH=%s\n' \
              "$RUNNER_TEMP/record-signing.p12"
            printf 'SIGNING_KEYCHAIN_PATH=%s\n' \
              "$RUNNER_TEMP/record-signing.keychain-db"
            printf 'NOTARY_KEY_PATH=%s\n' \
              "$RUNNER_TEMP/record-notary-key.p8"
            printf 'NOTARIZATION_ZIP_PATH=%s\n' \
              "$RUNNER_TEMP/Record-notarization.zip"
          } >> "$GITHUB_ENV"

      - name: Validate signed tag
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile \
            "$GITHUB_WORKSPACE/.github/allowed_signers"
          ./scripts/release/validate-tag.sh "$RELEASE_TAG"
          printf 'RELEASE_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate source contract
        run: ./scripts/ci/release-source-gate.sh

      - name: Restore exact successful CI app and security evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/restore-ci-app.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" \
            "$GITHUB_WORKSPACE/.build/release-artifacts/Record.app"

      - name: Stamp release version
        env:
          RECORD_VERSION: ${{ env.RELEASE_TAG }}
          RECORD_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export RECORD_VERSION="${RECORD_VERSION#v}"
          ./scripts/release/stamp-app.sh \
            "$GITHUB_WORKSPACE/.build/release-artifacts/Record.app" \
            "$RECORD_VERSION" "$RECORD_BUILD_NUMBER"
          ./scripts/ci/check-app-bundle.sh \
            "$GITHUB_WORKSPACE/.build/release-artifacts/Record.app"

      - name: Import signing identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode \
            > "$SIGNING_CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$SIGNING_CERTIFICATE_PATH" -k "$SIGNING_KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH"
          rm -f "$SIGNING_CERTIFICATE_PATH"

      - name: Sign app
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          app=.build/release-artifacts/Record.app
          ./scripts/release/sign-app.sh "$app" "$SIGNING_IDENTITY" timestamp

      - name: Verify stable privacy identity
        run: ./scripts/ci/check-tcc-identity.sh .build/release-artifacts/Record.app

      - name: Notarize app
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          trap 'rm -f "$NOTARY_KEY_PATH" "$NOTARIZATION_ZIP_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          COPYFILE_DISABLE=1 ditto --norsrc --noextattr -c -k --keepParent \
            .build/release-artifacts/Record.app \
            "$NOTARIZATION_ZIP_PATH"
          xcrun notarytool submit "$NOTARIZATION_ZIP_PATH" \
            --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple .build/release-artifacts/Record.app
          xcrun stapler validate .build/release-artifacts/Record.app

      - name: Package release
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          ./scripts/release/package.sh
          dmg="$GITHUB_WORKSPACE/.build/release-artifacts/Record.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          ./scripts/release/verify-dmg.sh "$dmg"

      - name: Restore locked Sparkle release tool
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
          test -x .build/artifacts/sparkle/Sparkle/bin/generate_appcast

      - name: Generate signed update feed
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: ./scripts/release/generate-appcast.sh "$RELEASE_TAG"

      - name: Finalize checksums
        run: |
          ./scripts/release/checksum-artifacts.sh
          (cd .build/release-artifacts && shasum -a 256 -c SHA256SUMS)

      # actions/attest-build-provenance v4.2.2, pinned to a verified commit.
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            .build/release-artifacts/Record.zip
            .build/release-artifacts/Record.dmg
            .build/release-artifacts/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            .build/release-artifacts/Record.zip \
            .build/release-artifacts/Record.dmg \
            .build/release-artifacts/appcast.xml \
            .build/release-artifacts/SHA256SUMS \
            .build/release-artifacts/Package.resolved \
            .build/release-artifacts/BUILD-METADATA.txt \
            --verify-tag \
            --notes-file "docs/releases/${RELEASE_TAG#v}.md" \
            --title "Record ${RELEASE_TAG#v}"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$SIGNING_CERTIFICATE_PATH" "$NOTARY_KEY_PATH" "$NOTARIZATION_ZIP_PATH"
          security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
