name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Define ephemeral signing paths
        run: |
          {
            printf 'SIGNING_CERTIFICATE_PATH=%s\n' \
              "$RUNNER_TEMP/record-signing.p12"
            printf 'SIGNING_KEYCHAIN_PATH=%s\n' \
              "$RUNNER_TEMP/record-signing.keychain-db"
            printf 'NOTARY_KEY_PATH=%s\n' \
              "$RUNNER_TEMP/record-notary-key.p8"
            printf 'NOTARIZATION_ZIP_PATH=%s\n' \
              "$RUNNER_TEMP/Record-notarization.zip"
          } >> "$GITHUB_ENV"

      - name: Validate tag
        run: ./scripts/release/validate-tag.sh "$RELEASE_TAG"

      - name: Validate source
        run: ./scripts/ci/validate.sh

      - name: Build app
        env:
          RECORD_VERSION: ${{ env.RELEASE_TAG }}
          RECORD_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export RECORD_VERSION="${RECORD_VERSION#v}"
          ./scripts/release/build-app.sh

      - name: Import signing identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode \
            > "$SIGNING_CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security import "$SIGNING_CERTIFICATE_PATH" -k "$SIGNING_KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN_PATH"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN_PATH"
          rm -f "$SIGNING_CERTIFICATE_PATH"

      - name: Sign app
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          app=.build/release-artifacts/Record.app
          codesign --force --options runtime --timestamp \
            --entitlements Configuration/Record.entitlements \
            --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ./scripts/ci/check-signed-entitlements.sh "$app"

      - name: Notarize app
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          trap 'rm -f "$NOTARY_KEY_PATH" "$NOTARIZATION_ZIP_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          ditto -c -k --keepParent .build/release-artifacts/Record.app \
            "$NOTARIZATION_ZIP_PATH"
          xcrun notarytool submit "$NOTARIZATION_ZIP_PATH" \
            --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple .build/release-artifacts/Record.app
          xcrun stapler validate .build/release-artifacts/Record.app

      - name: Package release
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          ./scripts/release/package.sh
          dmg=.build/release-artifacts/Record.dmg
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          ./scripts/release/checksum-artifacts.sh

      # actions/attest-build-provenance v2, pinned to a reviewed commit.
      - name: Attest artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            .build/release-artifacts/Record.zip
            .build/release-artifacts/Record.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            .build/release-artifacts/Record.zip \
            .build/release-artifacts/Record.dmg \
            .build/release-artifacts/SHA256SUMS \
            .build/release-artifacts/Package.resolved \
            .build/release-artifacts/BUILD-METADATA.txt \
            --verify-tag --generate-notes --title "Record $RELEASE_TAG"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$SIGNING_CERTIFICATE_PATH" "$NOTARY_KEY_PATH" "$NOTARIZATION_ZIP_PATH"
          security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
